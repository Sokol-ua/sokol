            // Функция для инициализации синхронизации чекбоксов
            function initializeCheckboxSync() {
                console.log('Initializing checkbox sync');
                // Массив для хранения всех категорий с ключом по имени для быстрого поиска
                const categoryMap = new Map();
                
                // Сначала собираем все категории с их чекбоксами
                document.querySelectorAll('.category-item').forEach(item => {
                    const checkbox = item.querySelector('.category-enabled-checkbox');
                    const nameElement = item.querySelector('.category-name span');
                    
                    if (checkbox && nameElement) {
                        const name = nameElement.textContent.trim();
                        
                        // Получаем ID категорий с поддержкой обоих типов атрибутов
                        let categoryIds = [];
                        if (item.hasAttribute('data-category-ids')) {
                            categoryIds = item.getAttribute('data-category-ids').split(',');
                        } else if (item.hasAttribute('data-category-id')) {
                            categoryIds = [item.getAttribute('data-category-id')];
                        } else {
                            console.warn('Item without category IDs:', item);
                        }
                        
                        if (!categoryMap.has(name)) {
                            categoryMap.set(name, []);
                        }
                        
                        categoryMap.get(name).push({
                            item: item,
                            checkbox: checkbox,
                            ids: categoryIds
                    });
                }
            });
            
                // Привязываем обработчик события изменения чекбокса
                document.querySelectorAll('.category-enabled-checkbox').forEach(checkbox => {
                    checkbox.addEventListener('change', function() {
                        const item = this.closest('.category-item');
                        const nameElement = item.querySelector('.category-name span');
                        const isChecked = this.checked;
                        
                        if (nameElement) {
                            const name = nameElement.textContent.trim();
                            
                            // Синхронизируем с другими экземплярами этой же категории
                            const relatedItems = categoryMap.get(name);
                            if (relatedItems && relatedItems.length > 1) {
                                relatedItems.forEach(related => {
                                    if (related.checkbox !== this && !related.checkbox.disabled) {
                                        related.checkbox.checked = isChecked;
                                    }
                                });
                            }
                            
                            // Проверяем, является ли это подкатегорией
                            const parentContainer = item.closest('.subcategories');
                            if (parentContainer) {
                                const parentItem = parentContainer.previousElementSibling;
                                if (parentItem) {
                                    // Обновляем родительскую категорию
                                    const parentCheckbox = parentItem.querySelector('.category-enabled-checkbox');
                                    if (parentCheckbox && !parentCheckbox.disabled) {
                                        if (isChecked) {
                                            // Если хотя бы одна подкатегория отмечена, родитель тоже отмечен
                                            parentCheckbox.checked = true;
                                        } else {
                                            // Если все подкатегории сняты, родитель тоже снят
                                            const allSubcategories = parentContainer.querySelectorAll('.category-enabled-checkbox');
                                            const anyChecked = Array.from(allSubcategories).some(cb => cb.checked);
                                            parentCheckbox.checked = anyChecked;
                                        }
                                    }
                                }
                            }
                            
                            // Если это родительская категория, обновляем все подкатегории
                            if (item.classList.contains('parent-category')) {
                                const nextElement = item.nextElementSibling;
                                if (nextElement && nextElement.classList.contains('subcategories')) {
                                    const subcategoryCheckboxes = nextElement.querySelectorAll('.category-enabled-checkbox');
                                    subcategoryCheckboxes.forEach(cb => {
                                        if (!cb.disabled) {
                                            cb.checked = isChecked;
                                        }
                                    });
                                }
                            }
                        }
                    });
                });
            }
            
            // Функция для обновления состояния чекбокса All
            function updateAllCheckbox() {
                console.log('Updating All checkbox state');
                const allCheckbox = document.querySelector('.category-item[data-category-id="0"] .category-enabled-checkbox') || 
                                   document.querySelector('.category-item[data-category-ids="0"] .category-enabled-checkbox');
                
                if (allCheckbox) {
                    const allOtherCheckboxes = Array.from(
                        document.querySelectorAll('.category-item:not([data-category-id="0"]):not([data-category-ids="0"]) .category-enabled-checkbox')
                    ).filter(cb => !cb.disabled);
                    
                    if (allOtherCheckboxes.length > 0) {
                        const allChecked = allOtherCheckboxes.every(cb => cb.checked);
                        allCheckbox.checked = allChecked;
                    }
                } else {
                    console.error('All checkbox not found');
                }
            }

            function showCategoryConditions(categoryIds) {
                // Now that we've moved the conditions to the category tree
                // this function will just highlight the category
                console.log('Showing category conditions for IDs:', categoryIds);
                
                const categoryItems = document.querySelectorAll('.category-item');
                categoryItems.forEach(item => {
                    try {
                        // Проверяем наличие обоих атрибутов с приоритетом на data-category-ids
                        const hasNewAttr = item.hasAttribute('data-category-ids');
                        const hasOldAttr = item.hasAttribute('data-category-id');
                        
                        let itemIds = [];
                        if (hasNewAttr) {
                            itemIds = item.getAttribute('data-category-ids').split(',');
                        } else if (hasOldAttr) {
                            itemIds = [item.getAttribute('data-category-id')];
                        } else {
                            console.warn('Item without category IDs:', item);
                            return;
                        }
                        
                        const matchesIds = Array.isArray(categoryIds) 
                            ? itemIds.some(id => categoryIds.includes(id))
                            : itemIds.includes(categoryIds.toString());
                        
                        if (matchesIds) {
                            item.classList.add('active');
                            // Scroll the category into view
                            item.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        } else {
                            item.classList.remove('active');
                        }
                    } catch (e) {
                        console.error('Error processing category item:', e, item);
                    }
                });
            }
            
            function showToast(message, type) {
                const toastContainer = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                
                let icon = 'fa-check-circle';
                if (type === 'error') {
                    icon = 'fa-exclamation-circle';
                } else if (type === 'info') {
                    icon = 'fa-info-circle';
                }
                
                toast.innerHTML = `
                    <i class="fas ${icon} toast-icon"></i>
                    <span class="toast-message">${message}</span>
                    <button class="toast-close"><i class="fas fa-times"></i></button>
                `;
                
                toastContainer.appendChild(toast);
                
                // Close button
                const closeButton = toast.querySelector('.toast-close');
                closeButton.addEventListener('click', function() {
                    toast.remove();
                });
                
                // Auto-remove after 3 seconds
                setTimeout(() => {
                    toast.remove();
                }, 3000);
            }

            // Add Feature functionality
            const addFeatureBtn = document.getElementById('addFeatureBtn');
            const addFeatureModal = new bootstrap.Modal(document.getElementById('addFeatureModal'));
            const addFeatureForm = document.getElementById('addFeatureForm');
            const saveFeatureBtn = document.getElementById('saveFeatureBtn');

            // Добавляем отладочную информацию
            console.log('Initialization of modal elements:', {
                addFeatureBtn: !!addFeatureBtn,
                addFeatureModal: !!addFeatureModal,
                addFeatureForm: !!addFeatureForm,
                saveFeatureBtn: !!saveFeatureBtn
            });

            // Handle category checkbox changes
            document.querySelectorAll('.category-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    const isAllCheckbox = this.id === 'category-all';
                    
                    if (isAllCheckbox) {
                        // If "All" is checked/unchecked, update all other checkboxes
                        document.querySelectorAll('.category-checkbox:not(#category-all), .subcategory-checkbox').forEach(cb => {
                            cb.checked = this.checked;
                        });
                    } else {
                        // For other category checkboxes
                        const formCheck = this.closest('.form-check');
                        const subcategoriesContainer = formCheck.querySelector('.ms-4');
                        if (subcategoriesContainer) {
                            const subcategories = subcategoriesContainer.querySelectorAll('.subcategory-checkbox');
                            subcategories.forEach(sub => {
                                sub.checked = this.checked;
                            });
                        }
                    }

                    // Update "All" checkbox state
                    if (!isAllCheckbox) {
                        const allCheckbox = document.getElementById('category-all');
                        const allCategoryCheckboxes = document.querySelectorAll('.category-checkbox:not(#category-all)');
                        const allSubcategoryCheckboxes = document.querySelectorAll('.subcategory-checkbox');
                        const allCheckedCategories = Array.from(allCategoryCheckboxes).filter(cb => cb.checked);
                        const allCheckedSubcategories = Array.from(allSubcategoryCheckboxes).filter(cb => cb.checked);
                        
                        allCheckbox.checked = allCheckedCategories.length === allCategoryCheckboxes.length && 
                                            allCheckedSubcategories.length === allSubcategoryCheckboxes.length;
                    }
                });
            });

            // Handle subcategory checkbox changes
            document.querySelectorAll('.subcategory-checkbox').forEach(checkbox => {
                checkbox.addEventListener('change', function() {
                    // Update parent category checkbox
                    const parentContainer = this.closest('.ms-4');
                    if (parentContainer) {
                        const parentFormCheck = parentContainer.closest('.form-check');
                        const parentCheckbox = parentFormCheck.querySelector('.category-checkbox');
                        if (parentCheckbox) {
                            const allSubcategories = parentContainer.querySelectorAll('.subcategory-checkbox');
                            const checkedSubcategories = Array.from(allSubcategories).filter(sub => sub.checked);
                            parentCheckbox.checked = checkedSubcategories.length > 0;
                        }
                    }

                    // Update "All" checkbox
                    const allCheckbox = document.getElementById('category-all');
                    const allCategoryCheckboxes = document.querySelectorAll('.category-checkbox:not(#category-all)');
                    const allSubcategoryCheckboxes = document.querySelectorAll('.subcategory-checkbox');
                    const allCheckedCategories = Array.from(allCategoryCheckboxes).filter(cb => cb.checked);
                    const allCheckedSubcategories = Array.from(allSubcategoryCheckboxes).filter(cb => cb.checked);
                    
                    allCheckbox.checked = allCheckedCategories.length === allCategoryCheckboxes.length && 
                                        allCheckedSubcategories.length === allSubcategoryCheckboxes.length;
                });
            });

            console.log('Using Bootstrap data attributes for modal opening');
            // addFeatureBtn.addEventListener('click', function() {
            //     addFeatureModal.show();
            // });

            // Добавляем отслеживание события показа модального окна
            document.getElementById('addFeatureModal').addEventListener('shown.bs.modal', function() {
                console.log('Modal window opened via Bootstrap data attributes');
            });

            saveFeatureBtn.addEventListener('click', function() {
                const featureName = document.getElementById('featureName').value;
                const featureEnabled = document.getElementById('featureEnabled').checked;
                const defaultConditions = document.getElementById('defaultFeatureConditions').value;

                if (!featureName) {
                    showToast('Please enter a feature name', 'error');
                    return;
                }

                // Generate new feature ID
                const newFeatureId = Math.max(...Object.keys(featureData).map(Number)) + 1;

                // Get selected categories
                const selectedCategories = [];
                document.querySelectorAll('.category-checkbox:checked, .subcategory-checkbox:checked').forEach(checkbox => {
                    const categoryId = checkbox.value;
                    const categoryName = checkbox.nextElementSibling.textContent.trim();
                    selectedCategories.push({
                        id: categoryId === 'jewelry' ? null : parseInt(categoryId),
                        name: categoryName,
                        conditions: defaultConditions // Применяем дефолтное условие ко всем выбранным категориям
                    });
                });

                // Create new feature
                featureData[newFeatureId] = {
                    name: featureName,
                    enabled: featureEnabled,
                    categories: [
                        ...selectedCategories
                    ]
                };

                // Save to localStorage
                localStorage.setItem('featureData', JSON.stringify(featureData));

                // Update UI
                renderFeatureList();
                loadFeatureData(newFeatureId);

                // Close modal and reset form
                addFeatureModal.hide();
                addFeatureForm.reset();

                showToast('Feature added successfully', 'success');
            });

            // Load saved features from localStorage on startup
            const savedFeatureData = localStorage.getItem('featureData');
            if (savedFeatureData) {
                featureData = JSON.parse(savedFeatureData);
                renderFeatureList();
            }

            // Initialize the first feature if available
            if (Object.keys(featureData).length > 0) {
                const firstFeatureId = Object.keys(featureData)[0];
                loadFeatureData(parseInt(firstFeatureId));
            }
            
            console.log('Initialization completed successfully');
        });

        function initializeControlButtons() {
            console.log('Initializing control buttons for', document.querySelectorAll('.mode-btn').length, 'mode buttons and',
                        document.querySelectorAll('.condition-action-btn').length, 'action buttons');
            
            // Mode buttons (Text/JSON)
            document.querySelectorAll('.mode-btn').forEach(button => {
                // Remove old event listeners (на всякий случай)
                const newButton = button.cloneNode(true);
                button.parentNode.replaceChild(newButton, button);
                
                // Add new event listener
                newButton.addEventListener('click', function(e) {
                    e.stopPropagation(); // Предотвращаем всплытие события
                    console.log('Mode button clicked:', this.getAttribute('data-mode'));
                    
                    const categoryItem = this.closest('.category-item');
                    const mode = this.getAttribute('data-mode');
                    const modeToggle = this.closest('.condition-mode-toggle');
                    
                    if (modeToggle) {
                        // Switch active class
                        modeToggle.querySelectorAll('.mode-btn').forEach(btn => {
                            btn.classList.remove('active');
                        });
                        this.classList.add('active');
                    }
                    
                    if (categoryItem) {
                        const textarea = categoryItem.querySelector('.condition-json-input');
                        const jsonEditor = categoryItem.querySelector('.json-editor-container');
                        
                        if (textarea && jsonEditor) {
                            if (mode === 'text') {
                                textarea.style.display = 'block';
                                jsonEditor.style.display = 'none';
                            } else {
                                textarea.style.display = 'none';
                                jsonEditor.style.display = 'block';
                                
                                // Initialize JSON editor if not already initialized
                                if (!jsonEditor.hasAttribute('data-initialized')) {
                                    try {
                                        // Подготавливаем контейнер
                                        jsonEditor.style.removeProperty('height');
                                        jsonEditor.classList.add('active');
                                        
                                        // Создаем уникальный идентификатор для редактора
                                        const uniqueId = 'editor_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
                                        jsonEditor.dataset.editor = uniqueId;
                                        
                                        const jsonContent = textarea.value ? JSON.parse(textarea.value) : {};
                                        const editor = new JSONEditor(jsonEditor, {
                                            mode: 'tree',
                                            modes: ['tree', 'code'],
                                            onChangeJSON: function(json) {
                                                textarea.value = JSON.stringify(json, null, 2);
                                                const event = new Event('change');
                                                textarea.dispatchEvent(event);
                                            }
                                        });
                                        
                                        editor.set(jsonContent);
                                        jsonEditor._jsoneditor = editor;
                                        jsonEditor.setAttribute('data-initialized', 'true');
                                        
                                        // Раскрываем все узлы
                                        if (editor.expandAll) {
                                            editor.expandAll();
                                        }
                                        
                                        // Создаем ResizeObserver для отслеживания изменений размера
                                        if (window.ResizeObserver) {
                                            const resizeObserver = new ResizeObserver(entries => {
                                                for (let entry of entries) {
                                                    // Если контейнер отображается, раскрываем все узлы JSON-редактора
                                                    if (entry.target.style.display !== 'none') {
                                                        try {
                                                            // Находим объект редактора
                                                            const editor = entry.target._jsoneditor;
                                                            if (editor && editor.expandAll) {
                                                                // Раскрываем все узлы
                                                                editor.expandAll();
                                                            }
                                                        } catch (e) {
                                                            console.error('Ошибка при работе с редактором:', e);
                                                        }
                                                    }
                                                }
                                            });
                                            
                                            // Начинаем наблюдение за контейнером
                                            resizeObserver.observe(jsonEditor);
                                        }
                                    } catch (e) {
                                        console.error('Failed to initialize JSON editor:', e);
                                        showToast('Invalid JSON format', 'error');
                                        // Revert to text mode
                                        if (modeToggle) {
                                            const textBtn = modeToggle.querySelector('[data-mode="text"]');
                                            if (textBtn) textBtn.click();
                                        }
                                    }
                                }
                            }
                        }
                    }
                });
            });
            
            // Copy button
            document.querySelectorAll('.condition-action-btn[title="Copy to clipboard"]').forEach(button => {
                // Remove old event listeners
                const newButton = button.cloneNode(true);
                button.parentNode.replaceChild(newButton, button);
                
                // Add new event listener
                newButton.addEventListener('click', function(e) {
                    e.stopPropagation(); // Предотвращаем всплытие события
                    console.log('Copy button clicked');
                    
                    const categoryItem = this.closest('.category-item');
                    if (categoryItem) {
                        const textarea = categoryItem.querySelector('.condition-json-input');
                        if (textarea) {
                            navigator.clipboard.writeText(textarea.value).then(() => {
                                showToast('Copied to clipboard', 'success');
                            }).catch(err => {
                                console.error('Copy failed:', err);
                                showToast('Failed to copy', 'error');
                            });
                        }
                    }
                });
            });
            
            // Format button
            document.querySelectorAll('.condition-action-btn[title="Format JSON"]').forEach(button => {
                // Remove old event listeners
                const newButton = button.cloneNode(true);
                button.parentNode.replaceChild(newButton, button);
                
                // Add new event listener
                newButton.addEventListener('click', function(e) {
                    e.stopPropagation(); // Предотвращаем всплытие события
                    console.log('Format button clicked');
                    
                    const categoryItem = this.closest('.category-item');
                    if (categoryItem) {
                        const textarea = categoryItem.querySelector('.condition-json-input');
                        const jsonEditor = categoryItem.querySelector('.json-editor-container');
                        
                        if (textarea) {
                            try {
                                const jsonContent = textarea.value ? JSON.parse(textarea.value) : {};
                                textarea.value = JSON.stringify(jsonContent, null, 2);
                                
                                // Update JSON editor if it's initialized and visible
                                if (jsonEditor && jsonEditor.hasAttribute('data-initialized')) {
                                    jsonEditor.jsonEditor.set(jsonContent);
                                }
                                
                                // Trigger change event
                                const event = new Event('change');
                                textarea.dispatchEvent(event);
                                
                                showToast('JSON formatted', 'success');
                            } catch (e) {
                                console.error('Invalid JSON format:', e);
                                showToast('Invalid JSON format', 'error');
                            }
                        }
                    }
                });
            });
        }
    </script>

    <!-- JavaScript для изменения ширины сайдбара -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Загрузка сохраненной ширины сайдбара из localStorage
            const savedSidebarWidth = localStorage.getItem('sidebarWidth');
            if (savedSidebarWidth) {
                document.documentElement.style.setProperty('--sidebar-width', savedSidebarWidth);
                document.getElementById('sidebar').style.width = savedSidebarWidth;
                
                // Также обновляем отступ для основного контента
                document.getElementById('mainContent').style.marginLeft = savedSidebarWidth;
            }
            
            // Реализация ресайзинга сайдбара
            const sidebar = document.getElementById('sidebar');
            const mainContent = document.getElementById('mainContent');
            const sidebarResizer = document.getElementById('sidebarResizer');
            
            let isResizing = false;
            let lastDownX = 0;
            
            // Функция установки ширины сайдбара
            function setSidebarWidth(width) {
                const widthPx = width + 'px';
                sidebar.style.width = widthPx;
                mainContent.style.marginLeft = widthPx;
                document.documentElement.style.setProperty('--sidebar-width', widthPx);
                localStorage.setItem('sidebarWidth', widthPx);
            }
            
            // Двойной клик по ресайзеру для сброса к стандартной ширине
            sidebarResizer.addEventListener('dblclick', function() {
                setSidebarWidth(400); // Сброс к стандартной ширине
                showToast('Ширина сайдбара сброшена к стандартной', 'success');
            });
            
            sidebarResizer.addEventListener('mousedown', function(e) {
                isResizing = true;
                lastDownX = e.clientX;
                
                // Добавляем класс для предотвращения выделения текста при ресайзе
                document.body.classList.add('no-select');
            });
            
            document.addEventListener('mousemove', function(e) {
                if (!isResizing) return;
                
                const offsetX = e.clientX - lastDownX;
                lastDownX = e.clientX;
                
                // Увеличиваем скорость изменения размера, применяя множитель
                const speedMultiplier = 2.5; // Коэффициент ускорения
                const currentWidth = parseInt(getComputedStyle(sidebar).width);
                const newWidth = currentWidth + (offsetX * speedMultiplier);
                
                // Ограничиваем минимальную и максимальную ширину
                if (newWidth >= 250 && newWidth <= 600) {
                    setSidebarWidth(newWidth);
                }
            });
            
            document.addEventListener('mouseup', function() {
                if (isResizing) {
                    isResizing = false;
                    document.body.classList.remove('no-select');
                }
            });
        });
        
        // Инициализация Select2 для улучшения выпадающих списков
        $(document).ready(function() {
            $('#categoryFilter').select2({
                placeholder: 'Выберите категории...',
                allowClear: true,
                width: '100%',
                dropdownCssClass: 'select2-dropdown-custom',
                selectionCssClass: 'select2-selection-custom',
                theme: 'default',
                language: {
                    noResults: function() {
                        return 'Ничего не найдено';
                    }
                }
            });
        });
    </script>

    <!-- Функция для инициализации JSON-редакторов и отслеживания их размера -->
    <script>
        // Глобальная функция для инициализации всех JSON-редакторов на странице
        function initializeJsonEditors() {
            console.log('Initializing JSON editors with advanced settings');
            
            // Находим все JSON-редакторы
            document.querySelectorAll('.json-editor-container').forEach(container => {
                // Удаляем фиксированную высоту и подготавливаем контейнер
                container.style.removeProperty('height');
                container.classList.add('active');
                
                // Проверяем, есть ли уже инициализированный редактор
                const editor = container._jsoneditor;
                if (editor && typeof editor.expandAll === 'function') {
                    try {
                        // Раскрываем все узлы в дереве
                        editor.expandAll();
                    } catch (e) {
                        console.error('Ошибка при раскрытии узлов:', e);
                    }
                }
                
                // Создаем ResizeObserver для отслеживания изменений размера
                if (window.ResizeObserver) {
                    const resizeObserver = new ResizeObserver(entries => {
                        for (let entry of entries) {
                            // Если контейнер отображается, раскрываем все узлы JSON-редактора
                            if (entry.target.style.display !== 'none') {
                                try {
                                    // Находим объект редактора через data-атрибут
                                    const uniqueId = entry.target.dataset.editor;
                                    if (uniqueId) {
                                        // Получаем доступ к редактору
                                        const editor = entry.target._jsoneditor;
                                        if (editor && editor.expandAll) {
                                            // Раскрываем все узлы
                                            editor.expandAll();
                                        }
                                    }
                                } catch (e) {
                                    console.error('Ошибка при работе с редактором:', e);
                                }
                            }
                        }
                    });
                    
                    // Начинаем наблюдение за контейнером
                    resizeObserver.observe(container);
                }
            });
        }
        
        // Автосохранение
        autoSave();
    </script>
